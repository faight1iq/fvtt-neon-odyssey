name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and URLs into module.json
        run: |
          TAG="${{ github.event.release.tag_name }}"
          REPO="https://github.com/${{ github.repository }}"
          jq --arg v "${TAG#v}" \
             --arg m "$REPO/releases/latest/download/module.json" \
             --arg d "$REPO/releases/download/$TAG/module.zip" \
             '.version=$v | .manifest=$m | .download=$d' module.json > tmp.json
          mv tmp.json module.json

      - name: Build module.zip
        run: |
          zip -r module.zip module.json scripts styles templates lang packs assets \
            -x "packs/*/LOCK"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
